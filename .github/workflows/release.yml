name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release tag
        run: node scripts/check-release-tag.mjs

      - name: Read package version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    name: Build macOS arm64
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build unsigned DMG
        run: pnpm dist:mac:arm64

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adit-${{ needs.validate.outputs.version }}-arm64
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Adit $TAG" \
            --notes "Unsigned macOS build. If macOS Gatekeeper blocks direct launch, open the app from Finder with Open."
          gh release upload "$TAG" release-artifacts/*.dmg --clobber
